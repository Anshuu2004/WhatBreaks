services:
  postgres:
    image: postgres:16-alpine
    container_name: whatbreaks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: whatbreaks
      POSTGRES_PASSWORD: testsecret
      POSTGRES_DB: whatbreaks
    ports:
      - "5432:5432"
    volumes:
      - whatbreaks_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatbreaks -d whatbreaks"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  whatbreaks_postgres_data:
    name: whatbreaks_postgres_data
